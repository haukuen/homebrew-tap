name: Bump Casks

on:
  schedule:
    - cron: "20 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bump-casks
  cancel-in-progress: false

jobs:
  bump:
    if: github.repository == 'haukuen/homebrew-tap'
    runs-on: macos-latest

    env:
      HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
      HOMEBREW_DEVELOPER: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}

      - name: Validate required secret
        run: |
          if [ -z "${HOMEBREW_GITHUB_API_TOKEN}" ]; then
            echo "Missing HOMEBREW_GITHUB_API_TOKEN secret."
            exit 1
          fi

      - name: Link workspace as tap
        run: |
          BREW_REPOSITORY="$(brew --repository)"
          TAP_PARENT="${BREW_REPOSITORY}/Library/Taps/haukuen"
          TAP_PATH="${TAP_PARENT}/homebrew-tap"

          mkdir -p "${TAP_PARENT}"
          rm -rf "${TAP_PATH}"
          ln -s "${GITHUB_WORKSPACE}" "${TAP_PATH}"

      - name: Update Homebrew metadata
        run: brew update

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Audit current tap
        run: brew audit --cask --strict --tap haukuen/tap

      - name: Show available updates
        run: |
          brew livecheck --quiet --newer-only --json --cask --tap haukuen/tap

      - name: Commit bumps directly to main
        run: |
          set -euo pipefail

          updates_json="$(brew livecheck --quiet --newer-only --json --cask --tap haukuen/tap)"
          echo "${updates_json}"

          if [ "${updates_json}" = "[]" ]; then
            echo "No updates found."
            exit 0
          fi

          while IFS=$'\t' read -r cask version; do
            [ -n "${cask}" ] || continue

            brew bump-cask-pr \
              --write-only \
              --commit \
              --no-fork \
              --version="${version}" \
              "${cask}"
          done < <(
            ruby -rjson -e '
              JSON.parse(STDIN.read).each do |item|
                cask = item["cask"]
                version = item.dig("version", "latest")
                next if cask.to_s.empty? || version.to_s.empty?

                puts "#{cask}\t#{version}"
              end
            ' <<<"${updates_json}"
          )

          git push origin HEAD:main
